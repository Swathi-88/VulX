# Anvil Policy Engine Rules Configuration (policies.yaml)
# Dynamic policy-as-code configuration for fraud routing decisions

severity_tiers:
  low_max: 1000.0
  medium_max: 10000.0
  # Transactions > medium_max are classified as 'high' severity

false_positive_cost_table:
  tenure_buckets:
    short_max_days: 30
    medium_max_days: 365
    # Customer tenure > medium_max_days is classified as 'long'
  matrix:
    long:
      high: high
      medium: medium
      low: low
    medium:
      high: medium
      medium: medium
      low: low
    short:
      high: medium
      medium: low
      low: low

reversibility_rules:
  reversible_actions:
    - ALLOW
    - REVIEW
    - BLOCK
  irreversible_actions:
    - PERMANENT_SUSPEND
    - HARD_BLOCK
  step_up_verification_available: true

uncertainty_thresholds:
  std_dev_thresholds:
    low_max: 0.05
    medium_max: 0.15
  distance_from_0_5_thresholds:
    high_min: 0.35
    medium_min: 0.15
  confidence_matrix:
    low:
      high: high
      medium: high
      low: medium
    medium:
      high: medium
      medium: medium
      low: low
    high:
      high: medium
      medium: low
      low: low

purpose_constraint_rules:
  restricted_tags:
    - cross_merchant_derived
  cross_merchant_features:
    - merchant_history_score
  enforce_minimum_action: VERIFY
  disallow_actions:
    - BLOCK

routing_rules:
  # 1. VIP False Positive Protection: Tenured customer + High value + Reversible -> Automated Step-Up 2FA
  - name: "Rule 1: High FP cost VIP protection"
    condition: "fp_cost == 'high' and is_reversible and confidence != 'high'"
    decision: "VERIFY"
    rationale: "final: VERIFY because high FP cost VIP customer requires step-up 2FA to prevent false positive block"

  # 2. Automated Hard Block: High risk on non-VIP / low FP cost account -> Direct Automated BLOCK
  - name: "Rule 2: Automated high-risk fraud block"
    condition: "naive_recommended_action == 'BLOCK' and fp_cost != 'high'"
    decision: "BLOCK"
    rationale: "final: BLOCK because high fraud probability detected on non-VIP account with genuine fraud signals"

  # 3. High Risk VIP Exception: High risk on VIP with high confidence -> Senior Analyst Review
  - name: "Rule 3: High FP cost high confidence exception review"
    condition: "fp_cost == 'high' and is_reversible and confidence == 'high' and naive_recommended_action == 'BLOCK'"
    decision: "HUMAN_REVIEW"
    rationale: "final: HUMAN_REVIEW because high fraud probability on VIP account requires manual analyst confirmation"

  # 4. Purpose Constraint: Cross-merchant signal on low-risk -> Automated Step-Up 2FA
  - name: "Rule 4: Purpose constraint minimum action requirement"
    condition: "purpose_constraint_triggered and naive_recommended_action == 'ALLOW'"
    decision: "VERIFY"
    rationale: "final: VERIFY because cross-merchant derived signals mandate automated step-up verification"

  # 5. Borderline Risk: Automate with Step-up 2FA instead of blocking or human review
  - name: "Rule 5: Borderline risk automated verification"
    condition: "naive_recommended_action == 'REVIEW' or (risk_probability >= 0.35 and risk_probability < 0.70)"
    decision: "VERIFY"
    rationale: "final: VERIFY because borderline risk is resolved automatically via step-up 2FA challenge"

  # 6. Irreversible Action Safety Fallback: Permanent suspensions require human oversight
  - name: "Rule 6: Irreversible action safety fallback"
    condition: "not is_reversible"
    decision: "HUMAN_REVIEW"
    rationale: "final: HUMAN_REVIEW because irreversible account suspension requires manual review"

  # 7. Clean Automated Settlement: Low risk -> Immediate Allow
  - name: "Rule 7: Low risk automated allow"
    condition: "True"
    decision: "ALLOW"
    rationale: "final: ALLOW because transaction has low risk probability and clean profile"
